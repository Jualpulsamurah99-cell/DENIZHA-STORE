<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pembayaran - DENIHZA STORE</title><link rel="stylesheet" href="style.css">
<style>.payment{max-width:560px;margin:45px auto;padding:0 18px}.paybox{background:#fff;border:1px solid #e4e8ef;border-radius:18px;padding:25px}.qris{width:100%;max-width:300px;aspect-ratio:1;object-fit:contain;border:1px solid #e5e9f0;border-radius:12px;display:block;margin:18px auto}.detail{background:#f3f6fc;border-radius:12px;padding:15px;margin:15px 0;font-size:13px}.row{display:flex;justify-content:space-between;gap:12px;margin:8px 0}.note{font-size:12px;color:#70798a;line-height:1.6}.back{display:block;text-align:center;margin-top:12px;color:#667085;font-size:13px}</style>
</head>
<body>
<header class="topbar"><div class="brand"><div class="logo">A</div><div><strong>DENIHZA STORE</strong><span>Pembayaran Pesanan</span></div></div></header>
<main class="payment"><div class="paybox">
<p class="eyebrow">PEMBAYARAN QRIS</p><h2>Selesaikan pembayaran</h2>
<div id="detail" class="detail"></div>
<img class="qris" src="qris.png" alt="QRIS DENIHZA STORE" onerror="this.style.display='none';document.getElementById('qrisMissing').style.display='block'">
<p id="qrisMissing" class="note" style="display:none;text-align:center">Gambar QRIS belum dipasang. Ganti file <b>qris.png</b> dengan QRIS kamu.</p>
<p class="note">Setelah pembayaran berhasil, simpan bukti pembayaran lalu tekan tombol Konfirmasi WhatsApp.</p>
<button id="confirm" class="primary-btn full">Konfirmasi via WhatsApp</button>
<a class="back" href="index.html">← Kembali ke toko</a>
</div></main>
<script>
const CONFIG={whatsapp:"6285777949213"};
const order=JSON.parse(sessionStorage.getItem("denihzaOrder")||"null");
if(!order){document.getElementById("detail").innerHTML="Pesanan tidak ditemukan. Silakan kembali ke toko.";document.getElementById("confirm").style.display="none";}
else{
 const rupiah=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n);
 document.getElementById("detail").innerHTML=`<div class="row"><span>ID Pesanan</span><b>${order.orderId}</b></div><div class="row"><span>Produk</span><b>${order.provider} - ${order.name}</b></div><div class="row"><span>Nomor Tujuan</span><b>${order.number}</b></div><div class="row"><span>Nama</span><b>${order.buyer}</b></div><div class="row"><span>Total</span><b>${rupiah(order.price)}</b></div>`;
 document.getElementById("confirm").onclick=()=>{
   const msg=`Halo DENIHZA STORE, saya sudah melakukan pembayaran.%0A%0AID Pesanan: ${order.orderId}%0AProduk: ${order.provider} - ${order.name}%0ANomor tujuan: ${order.number}%0ANama: ${order.buyer}%0ATotal: ${rupiah(order.price)}%0A%0ASaya akan mengirim bukti pembayaran.`;
   location.href=`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`;
 };
}
</script>
</body></html>
